<head>
    <meta charset="utf-8" />

    <style>
        body {
            margin: 1rem;
            /* display: flex; */

            background-color: #060606 !important;

        button:active {
            background-color: rgba(242, 243, 246, 0.99);
            color: rgba(176, 81, 3, 0.829);
        }

        #status {
            margin-left: 10px;
            font-weight: bold;
            color: rgba(230, 146, 12, 0.808);
            display: flex;
            justify-content: center;

        }

        h2 {
            text-align: center;
            font-size: 1.0em;
        }

        #first-row-buttons {
            display: flex;
            justify-content: center;
        }

        #second-row-buttons {
            display: flex;
            justify-content: center;
        }

        #third-row-buttons {
            display: flex;

        }

        #stream-row {
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>
    <h2>Object Detection, Pose Estimation, Segmentation.</h2>
    <h2>Custom model- Yolo 11 (Jetson Orin Nano)</h2>
    <h2>Recognize Irish registration plates (easyOCR)</h2>
    <div id="first-row-buttons">
        <button id="btn-detect">Object Detection</button>
        <button id="btn-pose">Pose Estimation</button>
        <button id="btn-segmentation">Segmentation</button>
        <!-- <button id="btn-custom-model">Custom Model</button>
        <button id="btn-plate-recognition">Plate Recognition</button>
        <button id="btn-irish-plate-recognition">Irish Plate Recognition</button> -->

    <div id="second-row-buttons">
        <!-- <button id="btn-detect">Object Detection</button>
        <button id="btn-pose">Pose Estimation</button>
        <button id="btn-segmentation">Segmentation</button> -->
        <button id="btn-custom-model">Custom Model</button>
        <button id="btn-plate-recognition">Plate Recognition</button>
        <button id="btn-irish-plate-recognition">Irish Plate Recognition</button>
        <!-- <span id="status">Loading...</span> -->
    </div>

    <div id="third-row-buttons">
        <!-- <button id="btn-detect">Object Detection</button>
        <button id="btn-pose">Pose Estimation</button>
        <button id="btn-segmentation">Segmentation</button> -->
        <button id="btn-improved-irish-plate-recognition">Improved Irish Plate Recognition</button>
        <button id="btn-lprnet-anpr">LPRNet ANPR</button>
        <!-- <button id="btn-plate-recognition">Plate Recognition</button> -->
        <!-- <button id="btn-irish-plate-recognition">Irish Plate Recognition</button> -->
        <!-- <span id="status">Loading...</span> -->
    </div>




    <!-- </div> -->
    <div>
        <span id="status">Loading...</span>
    </div>

    <div style="display:flex; justify-content:center; align-items:center; margin-top:10px;">
        <button id="record-toggle">Start recording</button>
        <button id="save-image">Save image</button>
        <span id="save-image-status" style="color:orange; margin-left:12px;"></span>

        <select id="record-resolution" style="margin-left:10px;">
            <option value="1280x720">1280x720</option>
            <option value="960x540">960x540</option>
            <option value="640x360">640x360</option>
        </select>

        <select id="record-fps" style="margin-left:10px;">
            <option value="30">30 FPS</option>
            <option value="20">20 FPS</option>
            <option value="15">15 FPS</option>
            <option value="10">10 FPS</option>
        </select>


        <span id="record-status" style="color:orange; margin-left:12px;">Recording: off</span>
    </div>

    <div style="display:flex; justify-content:center; margin-top:10px;">
        <button id="toggle-camera-settings">Camera settings</button>
    </div>

    <div id="camera-settings-panel" style="display:none; margin-top:10px;">
        <div id="focus-controls" style="display:flex; justify-content:center; align-items:center; margin-top:10px;">
            <button id="focus-minus">Focus -</button>
            <span id="focus-value" style="color:orange; margin: 0 12px;font-size: 0.6em;">Focus: 30</span>
            <button id="focus-plus">Focus +</button>
        </div>

        <!-- <div id="exposure-controls" style="display:flex; justify-content:center; align-items:center; margin-top:10px;">
        <button id="exposure-minus">Exposure -</button>
        <span id="exposure-value" style="color:orange; margin: 0 12px;">Exposure: -5</span>
        <button id="exposure-plus">Exposure +</button>
    </div> -->

        <!-- <div style="display:flex; justify-content:center; align-items:center; margin-top:10px;">
        <button id="zoom-abs-minus">Zoom -</button>
        <span id="zoom-abs-value" style="color:orange; margin: 0 12px;">Zoom: 100</span>
        <button id="zoom-abs-plus">Zoom +</button>
    </div> -->

        <div style="display:flex; justify-content:center; align-items:center; margin-top:3px;">
            <button id="digital-zoom-minus">Digital Zoom -</button>
            <span id="digital-zoom-value" style="color:orange; margin: 0 5px;font-size: 0.6em;">Digital Zoom:
                1.0x</span>
            <button id="digital-zoom-plus">Digital Zoom +</button>
        </div>

        <div id="gain-controls" style="display:flex; justify-content:center; align-items:center; margin-top:3px;">
            <button id="gain-minus">Gain -</button>
            <span id="gain-value" style="color:orange; margin: 0 5px;font-size: 0.6em;">Gain: 0</span>
            <button id="gain-plus">Gain +</button>
        </div>

        <div style="display:flex; justify-content:center; align-items:center; margin-top:3px;">
            <button id="exposure-abs-minus">Exposure -</button>
            <span id="exposure-abs-value" style="color:orange; margin: 0 5px;font-size: 0.6em;">Exposure abs: 210</span>
            <button id="exposure-abs-plus">Exposure +</button>
        </div>

        <div style="display:flex; justify-content:center; align-items:center; margin-top:10px;">
            <button id="camera-normal">Normal</button>
            <button id="camera-car">Car / 180°</button>
            <span id="camera-orientation-value" style="color:orange; margin: 0 12px;">Mode: Normal</span>
        </div>
    </div>









    <div id="stream-row" style="margin-top:10px">
        <img id="stream" src="/video_feed" width="640px" />
    </div>

    <script>
        const btnDetect = document.getElementById('btn-detect');
        const btnPose = document.getElementById('btn-pose');
        const btnSegmentation = document.getElementById('btn-segmentation');
        const btnCustomModel = document.getElementById('btn-custom-model');
        const btnPlateRecognition = document.getElementById('btn-plate-recognition');
        const btnIrishPlateRecognition = document.getElementById('btn-irish-plate-recognition');
        const btnImprovedIrishPlateRecognition = document.getElementById('btn-improved-irish-plate-recognition');
        const btnLprnetAnpr = document.getElementById('btn-lprnet-anpr');
        const statusEl = document.getElementById('status');

        async function switchModel(name) {
            disableButtons(true);
            statusEl.textContent = 'Switching...';
            try {
                await fetch('/switch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: name })
                });
            } catch (e) {
                console.error(e);
            }
            // poll status until loaded
            pollStatus();
        }

        btnDetect.onclick = () => switchModel('detection');
        btnPose.onclick = () => switchModel('pose');
        btnSegmentation.onclick = () => switchModel('segmentation');
        btnCustomModel.onclick = () => switchModel('custom-model');
        btnPlateRecognition.onclick = () => switchModel('plate-recognition');
        btnIrishPlateRecognition.onclick = () => switchModel('irish-plate-recognition');
        btnImprovedIrishPlateRecognition.onclick = () => switchModel('improved-irish-plate-recognition');
        btnLprnetAnpr.onclick = () => switchModel('lprnet-anpr');
        function disableButtons(v) {
            btnDetect.disabled = v;
            btnPose.disabled = v;
            btnSegmentation.disabled = v;
            btnCustomModel.disabled = v;
            btnPlateRecognition.disabled = v;
            btnIrishPlateRecognition.disabled = v;
            btnImprovedIrishPlateRecognition.disabled = v;
            btnLprnetAnpr.disabled = v;
        }

        // This function polls the /status endpoint every second to get the current active model and its loading status.
        // If the model is not yet loaded, It updates the status text and button states accordingly.
        async function pollStatus() {
            try {
                const r = await fetch('/status');
                const j = await r.json();
                const active = j.active;
                const loaded = j.loaded || {};
                const fps = j.fps ? j.fps.toFixed(1) : '0.0';
                statusEl.textContent = `Active: ${active} | FPS: ${fps}`;
                btnDetect.disabled = (active === 'detection');
                btnPose.disabled = (active === 'pose');
                btnSegmentation.disabled = (active === 'segmentation');
                btnCustomModel.disabled = (active === 'custom-model');
                btnPlateRecognition.disabled = (active === 'plate-recognition');
                btnIrishPlateRecognition.disabled = (active === 'irish-plate-recognition');
                btnImprovedIrishPlateRecognition.disabled = (active === 'improved-irish-plate-recognition');
                btnLprnetAnpr.disabled = (active === 'lprnet-anpr');
                // if active model not yet loaded show loading and keep polling
                if (!loaded[active]) {
                    statusEl.textContent = `Loading ${active}...`;
                    disableButtons(true);
                    setTimeout(pollStatus, 1000);
                } else {
                    disableButtons(false);
                }
            } catch (e) {
                console.error('status error', e);
                setTimeout(pollStatus, 2000);
            }
        }

        // start polling
        pollStatus();


        let focusValue = 30;

        async function setFocus(value) {
            focusValue = Math.max(0, Math.min(255, value));

            document.getElementById('focus-value').textContent = `Focus: ${focusValue}`;

            try {
                const r = await fetch('/camera/focus', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ focus: focusValue })
                });

                const j = await r.json();
                console.log('Focus updated:', j);
            } catch (e) {
                console.error('Focus error:', e);
            }
        }

        document.getElementById('focus-minus').onclick = () => setFocus(focusValue - 5);
        document.getElementById('focus-plus').onclick = () => setFocus(focusValue + 5);

        // let exposureValue = -5;
        let gainValue = 0;

        // async function setExposure(value) {
        //     exposureValue = Math.max(-13, Math.min(0, value));
        //     document.getElementById('exposure-value').textContent = `Exposure: ${exposureValue}`;

        //     const r = await fetch('/camera/exposure', {
        //         method: 'POST',
        //         headers: { 'Content-Type': 'application/json' },
        //         body: JSON.stringify({ exposure: exposureValue })
        //     });

        //     console.log('Exposure updated:', await r.json());
        // }





        async function setGain(value) {
            gainValue = Math.max(0, Math.min(255, value));
            document.getElementById('gain-value').textContent = `Gain: ${gainValue}`;

            const r = await fetch('/camera/gain', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ gain: gainValue })
            });

            console.log('Gain updated:', await r.json());
        }

        // document.getElementById('exposure-minus').onclick = () => setExposure(exposureValue - 1);
        // document.getElementById('exposure-plus').onclick = () => setExposure(exposureValue + 1);

        document.getElementById('gain-minus').onclick = () => setGain(gainValue - 5);
        document.getElementById('gain-plus').onclick = () => setGain(gainValue + 5);




        let exposureAbsValue = 210;

        async function setExposureAbs(value) {
            exposureAbsValue = Math.max(3, Math.min(2047, value));
            document.getElementById('exposure-abs-value').textContent = `Exposure abs: ${exposureAbsValue}`;

            const r = await fetch('/camera/exposure_abs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ exposure: exposureAbsValue })
            });

            console.log('Exposure abs updated:', await r.json());
        }

        document.getElementById('exposure-abs-minus').onclick = () => setExposureAbs(exposureAbsValue - 20);
        document.getElementById('exposure-abs-plus').onclick = () => setExposureAbs(exposureAbsValue + 20);


        // let zoomAbsValue = 100;

        // async function setZoomAbs(value) {
        //     zoomAbsValue = Math.max(177, Math.min(500, value));
        //     document.getElementById('zoom-abs-value').textContent = `Zoom: ${zoomAbsValue}`;

        //     const r = await fetch('/camera/zoom_abs', {
        //         method: 'POST',
        //         headers: { 'Content-Type': 'application/json' },
        //         body: JSON.stringify({ zoom: zoomAbsValue })
        //     });

        //     console.log('Zoom abs updated:', await r.json());
        // }

        // document.getElementById('zoom-abs-minus').onclick = () => setZoomAbs(zoomAbsValue - 1);
        // document.getElementById('zoom-abs-plus').onclick = () => setZoomAbs(zoomAbsValue + 1);

        let digitalZoomValue = 1.0;

        async function setDigitalZoom(value) {
            digitalZoomValue = Math.max(1.0, Math.min(3.0, value));
            digitalZoomValue = Math.round(digitalZoomValue * 10) / 10;

            document.getElementById('digital-zoom-value').textContent =
                `Digital Zoom: ${digitalZoomValue.toFixed(1)}x`;

            const r = await fetch('/camera/digital_zoom', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ zoom: digitalZoomValue })
            });

            console.log('Digital zoom updated:', await r.json());
        }

        document.getElementById('digital-zoom-minus').onclick = () =>
            setDigitalZoom(digitalZoomValue - 0.1);

        document.getElementById('digital-zoom-plus').onclick = () =>
            setDigitalZoom(digitalZoomValue + 0.1);

        async function setCameraOrientation(mode) {
            const r = await fetch('/camera/orientation', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mode })
            });

            const j = await r.json();

            document.getElementById('camera-orientation-value').textContent =
                `Mode: ${j.mode === 'car' ? 'Car / 180°' : 'Normal'}`;

            console.log('Camera orientation:', j);
        }

        document.getElementById('camera-normal').onclick = () =>
            setCameraOrientation('normal');

        document.getElementById('camera-car').onclick = () =>
            setCameraOrientation('car');


        const toggleCameraSettingsBtn = document.getElementById('toggle-camera-settings');
        const cameraSettingsPanel = document.getElementById('camera-settings-panel');

        toggleCameraSettingsBtn.onclick = () => {
            const isHidden = cameraSettingsPanel.style.display === 'none';

            cameraSettingsPanel.style.display = isHidden ? 'block' : 'none';

            toggleCameraSettingsBtn.textContent = isHidden
                ? 'Hide camera settings'
                : 'Camera settings';
        };

        let isRecording = false;

        document.getElementById('record-toggle').onclick = async () => {
            const res = document.getElementById('record-resolution').value;
            const fps = parseInt(document.getElementById('record-fps').value);

            const [width, height] = res.split('x').map(Number);

            const r = await fetch('/recording/toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ width, height, fps })
            });

            const j = await r.json();
            console.log('Recording:', j);

            if (j.ok) {
                isRecording = j.recording;

                document.getElementById('record-toggle').textContent =
                    isRecording ? 'Stop recording' : 'Start recording';

                document.getElementById('record-status').textContent =
                    isRecording ? `Recording: ON ${width}x${height} ${fps}FPS` : 'Recording: off';
            }
        };


        // save image
        document.getElementById('save-image').onclick = async () => {
            const r = await fetch('/recording/save_image', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });

            const j = await r.json();
            console.log('Save image:', j);

            document.getElementById('save-image-status').textContent =
                j.ok ? 'Image saved' : 'Save failed';
        };

    </script>
</body>
