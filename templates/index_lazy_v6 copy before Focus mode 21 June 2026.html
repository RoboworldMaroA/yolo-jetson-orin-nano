<!doctype html>
<html>
<link href="https://googleapis.com" rel="stylesheet">

<head>
    <meta charset="utf-8" />
    <title>Roboworld Jetson

    </title>
    <style>
        body {
            margin: 1rem;
            /* display: flex; */
            place-items: center;
            background-color: #060606 !important;
            /* min-width: 320px;
  min-height: 100vh; */

            font-family: "Rajdhani";
            /* font-optical-sizing: auto; */
            font-weight: 300;
            font-style: normal;
            justify-content: center;
        }

        button {
            font-family: "Rajdhani";
            font-weight: 300;
            font-color: rgba(44, 46, 10, 0.163);
            align-items: center;
            margin: 6px;
            padding: 8px 14px;
            font-size: 0.8em;
            border-radius: 5px;
        }

        button:active {
            background-color: rgba(242, 243, 246, 0.99);
            color: rgba(176, 81, 3, 0.829);
        }

        #status {
            margin-left: 10px;
            font-weight: bold;
            color: rgba(230, 146, 12, 0.808);
            display: flex;
            justify-content: center;

        }

        h2 {
            text-align: center;
            font-size: 1.0em;
        }

        #first-row-buttons {
            display: flex;
            justify-content: center;
        }

        #second-row-buttons {
            display: flex;
            justify-content: center;
        }

        #third-row-buttons {
            display: flex;
            justify-content: center;
        }

        #stream-row {
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>
    <h2>Object Detection, Pose Estimation, Segmentation.</h2>
    <h2>Custom model- Yolo 11 (Jetson Orin Nano)</h2>
    <h2>Recognize Irish registration plates (easyOCR)</h2>
    <div id="first-row-buttons">
        <button id="btn-detect">Object Detection</button>
        <button id="btn-pose">Pose Estimation</button>
        <button id="btn-segmentation">Segmentation</button>
        <!-- <button id="btn-custom-model">Custom Model</button>
        <button id="btn-plate-recognition">Plate Recognition</button>
        <button id="btn-irish-plate-recognition">Irish Plate Recognition</button> -->
        <!-- <span id="status">Loading...</span> -->
    </div>

    <div id="second-row-buttons">
        <!-- <button id="btn-detect">Object Detection</button>
        <button id="btn-pose">Pose Estimation</button>
        <button id="btn-segmentation">Segmentation</button> -->
        <button id="btn-custom-model">Custom Model</button>
        <button id="btn-plate-recognition">Plate Recognition</button>
        <button id="btn-irish-plate-recognition">Irish Plate Recognition</button>
        <!-- <span id="status">Loading...</span> -->
    </div>

    <div id="third-row-buttons">
        <!-- <button id="btn-detect">Object Detection</button>
        <button id="btn-pose">Pose Estimation</button>
        <button id="btn-segmentation">Segmentation</button> -->
        <button id="btn-improved-irish-plate-recognition">Improved Irish Plate Recognition</button>
        <button id="btn-lprnet-anpr">LPRNet ANPR</button>
        <!-- <button id="btn-plate-recognition">Plate Recognition</button> -->
        <!-- <button id="btn-irish-plate-recognition">Irish Plate Recognition</button> -->
        <!-- <span id="status">Loading...</span> -->
    </div>
    <div>
        <span id="status">Loading...</span>
    </div>
    <div id="stream-row" style="margin-top:15px">
        <img id="stream" src="/video_feed" width="640px" />
    </div>

    <script>
        const btnDetect = document.getElementById('btn-detect');
        const btnPose = document.getElementById('btn-pose');
        const btnSegmentation = document.getElementById('btn-segmentation');
        const btnCustomModel = document.getElementById('btn-custom-model');
        const btnPlateRecognition = document.getElementById('btn-plate-recognition');
        const btnIrishPlateRecognition = document.getElementById('btn-irish-plate-recognition');
        const btnImprovedIrishPlateRecognition = document.getElementById('btn-improved-irish-plate-recognition');
        const btnLprnetAnpr = document.getElementById('btn-lprnet-anpr');
        const statusEl = document.getElementById('status');

        async function switchModel(name) {
            disableButtons(true);
            statusEl.textContent = 'Switching...';
            try {
                await fetch('/switch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: name })
                });
            } catch (e) {
                console.error(e);
            }
            // poll status until loaded
            pollStatus();
        }

        btnDetect.onclick = () => switchModel('detection');
        btnPose.onclick = () => switchModel('pose');
        btnSegmentation.onclick = () => switchModel('segmentation');
        btnCustomModel.onclick = () => switchModel('custom-model');
        btnPlateRecognition.onclick = () => switchModel('plate-recognition');
        btnIrishPlateRecognition.onclick = () => switchModel('irish-plate-recognition');
        btnImprovedIrishPlateRecognition.onclick = () => switchModel('improved-irish-plate-recognition');
        btnLprnetAnpr.onclick = () => switchModel('lprnet-anpr');
        function disableButtons(v) {
            btnDetect.disabled = v;
            btnPose.disabled = v;
            btnSegmentation.disabled = v;
            btnCustomModel.disabled = v;
            btnPlateRecognition.disabled = v;
            btnIrishPlateRecognition.disabled = v;
            btnImprovedIrishPlateRecognition.disabled = v;
            btnLprnetAnpr.disabled = v;
        }

        // This function polls the /status endpoint every second to get the current active model and its loading status.
        // If the model is not yet loaded, It updates the status text and button states accordingly.
        async function pollStatus() {
            try {
                const r = await fetch('/status');
                const j = await r.json();
                const active = j.active;
                const loaded = j.loaded || {};
                const fps = j.fps ? j.fps.toFixed(1) : '0.0';
                statusEl.textContent = `Active: ${active} | FPS: ${fps}`;
                btnDetect.disabled = (active === 'detection');
                btnPose.disabled = (active === 'pose');
                btnSegmentation.disabled = (active === 'segmentation');
                btnCustomModel.disabled = (active === 'custom-model');
                btnPlateRecognition.disabled = (active === 'plate-recognition');
                btnIrishPlateRecognition.disabled = (active === 'irish-plate-recognition');
                btnImprovedIrishPlateRecognition.disabled = (active === 'improved-irish-plate-recognition');
                btnLprnetAnpr.disabled = (active === 'lprnet-anpr');
                // if active model not yet loaded show loading and keep polling
                if (!loaded[active]) {
                    statusEl.textContent = `Loading ${active}...`;
                    disableButtons(true);
                    setTimeout(pollStatus, 1000);
                } else {
                    disableButtons(false);
                }
            } catch (e) {
                console.error('status error', e);
                setTimeout(pollStatus, 2000);
            }
        }

        // start polling
        pollStatus();
    </script>
</body>

</html>
